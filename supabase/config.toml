# This project has no local dev stack (no `supabase start` workflow) — this
# file exists solely to make per-function deploy settings durable across
# redeploys, since `supabase functions deploy` flags like --no-verify-jwt
# otherwise leave no trace in version control.

[functions.manage-staff]
# Operator creates/lists/deletes their park staff. Verifies the caller from
# the Authorization bearer via auth.getUser() and requires org_owner role, so
# it handles auth itself rather than relying on the platform JWT gate.
verify_jwt = false

[functions.admin-operator-users]
# Super-admin bridge from the shared staff dashboard into the operator
# project's auth + organization memberships. Verifies the real staff admin via
# the shared-session bearer inside the function, so the platform JWT gate must
# not reject that foreign-project token first.
verify_jwt = false

[functions.admin-cost-items]
# Browser calls from the staff dashboard authenticate inside the function via
# the shared-project bearer and should not be blocked by the platform gate
# before CORS / auth handling runs.
verify_jwt = false

[functions.admin-set-park-password]
# Super-admin sets park passwords from the shared staff dashboard and passes
# the real shared-project staff session in the request body. The operator
# project's JWT gateway must not reject that cross-project flow first.
verify_jwt = false

[functions.email-lead-intake]
# Called by Make.com (no Supabase session), authenticated via its own
# X-Intake-Secret header instead of a platform JWT.
verify_jwt = false

[functions.product-finder-intake]
# Same as email-lead-intake above, for the product_finder_submissions table.
verify_jwt = false

[functions.website-requests-intake]
# Same as email-lead-intake above, for the website_requests table.
verify_jwt = false

[functions.german-website-requests-intake]
# Same as email-lead-intake above, for the german_website_requests table.
verify_jwt = false

[functions.dispatch-lead-push]
# Called by a Postgres trigger (pg_net), not by a browser session — gated by
# its own X-Dispatch-Secret header instead of a platform JWT.
verify_jwt = false

[functions.operator-notification-settings]
# Browser calls come from operator accounts on the separate operator project.
# These functions validate the operator token themselves via _shared/operatorAuth.ts,
# so the shared-project JWT gateway must not reject that foreign-project token first.
verify_jwt = false

[functions.operator-push-subscription]
# Same cross-project operator auth pattern as operator-notification-settings.
verify_jwt = false

[functions.operator-test-push]
# Same cross-project operator auth pattern as operator-notification-settings.
verify_jwt = false

[functions.operator-liftpic-assets]
# Same cross-project operator auth pattern as operator-notification-settings:
# the park operator uploads kiosk branding images from the customer dashboard,
# so the caller's token comes from the operator project and must be validated
# by the function itself via _shared/operatorAuth.ts.
verify_jwt = false
